# KubeGuardian 설정 예시. 복사해서 kubeguardian.yaml로 쓴다 (클러스터에서는 ConfigMap).
# 비밀값(토큰·키·계정)은 여기에 두지 않고 Secret 이름만 적는다.
# LLM 연결 정보는 환경 변수(LLM_PROVIDER, AZURE_OPENAI_*), 모델은 에이전트 버전 설정에서 정한다.
target:
  namespace: dev
schedule: "*/5 * * * *"
core_paths:                 # 사용자 기능 → 서비스 (1차 심각도 판정, docs/05-rules.md §3)
  login: [front-chat, gateway, admin]
  chat: [front-chat, gateway, agent, llm-gateway]
external_hosts:             # S04 제외: 클러스터 밖 호스트
  - "*.openai.azure.com"
# required_config:          # C05: 서비스가 반드시 가져야 할 env 이름 (선언한 것의 부재만 적발, docs/05-rules.md §4)
#   gateway: [ADMIN_SERVICE_URL, AGENT_SERVICE_URL]
topology:
  url_env_patterns: ["*_SERVICE_URL", "*_URL"]
api_scenarios:               # run_api_scenario. 단계 형식은 app/core/config.py ApiScenarioStep
  - name: chat               # 템플릿 로그인 → 채팅 (scripts/target/smoke.sh와 같은 흐름)
    steps:
      # 본문은 Secret kg-test-user의 키·값 그대로({"id", "password"}). 계정을 여기에 적지 않는다.
      # 응답 {"access_token", "user"}에서 토큰과 사용자의 첫 조직을 꺼낸다
      - login:
          via: gateway
          path: /api/v1/auth/login
          account_secret: kg-test-user
          token: access_token
          extract: {org_id: user.role.organizations.0.org_id}
      # 응답 {"success": true, "data": {"answer": ...}}. 템플릿은 LLM 호출이 실패해도 HTTP 200에
      # "오류가 발생했습니다: ..."를 answer로 돌려주므로 이 문구로 시작하면 실패로 본다
      - call:
          via: gateway
          path: /api/v1/agent/invoke
          body: {query: "한 문장으로 자기소개를 해 주세요.", model: gpt-4.1, org_id: "${org_id}"}
          expect: 200
          timeout_s: 60
          check: {path: data.answer, not_starts_with: "오류가 발생했습니다:"}
app_apis:                   # query_app_api 허용 목록 (GET만)
  llm-gateway: [/api/v1/health, /api/v1/quota]
slack:
  alert_target: "#pr-service-ops"
  bot_token_secret: kg-slack-bot
  app_token_secret: kg-slack-app
  allowed_channels: ["#pr-service-ops"]
  allowed_users: []
  reminders:
    critical: {first_after: 30m, then_every: 2h, max: 3}
    warning: {first_after: 2h, max: 1}
knowledge:
  runbooks: [./runbooks/]
  environment: ./environment.md
