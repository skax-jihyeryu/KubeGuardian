<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="'Noto Sans KR', sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .laneTitle { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .code { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
      .llm { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .out { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; }
      .ext { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .note { fill: #fefce8; stroke: #a16207; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .fail { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.2; }
      .node { font-family: 'DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .t { fill: #1e293b; }
      .s { font-size: 11.5px; fill: #475569; }
      .edge { stroke: #334155; stroke-width: 1.4; fill: none; }
      .loop { stroke: #c2410c; stroke-width: 2.4; fill: none; }
      .redEdge { stroke: #b91c1c; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
      .elabel { font-size: 11.5px; fill: #334155; }
      .loopLabel { font-size: 12px; font-weight: 700; fill: #c2410c; }
      .stPanel { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.4; }
      .stHead { font-size: 12px; font-weight: 700; fill: #6d28d9; }
      .f { font-family: 'DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 12px; fill: #1e1b4b; }
      .w { font-size: 11px; fill: #7c3aed; text-anchor: end; }
      .d { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="1010" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="700" fill="#0f172a">KubeGuardian 처리 흐름과 조사 상태(State)</text>
  <text x="430" y="32" font-size="12.5" fill="#475569">주황 테두리 = LLM 사용 노드, 회색 = 코드만 실행, 주황 굵은 화살표 = 도구 반복 실행</text>

  <!-- ===== 1. 점검과 판정 ===== -->
  <rect class="lane" x="10" y="50" width="950" height="244" rx="8"/>
  <text class="laneTitle" x="26" y="74">1. 점검과 판정 (코드만 실행, LLM 없음)</text>

  <rect class="code" x="30" y="96" width="165" height="88" rx="6"/>
  <text class="t" x="112" y="122" text-anchor="middle" font-weight="700">입력 (트리거)</text>
  <text class="s" x="112" y="142" text-anchor="middle">매시 정각 점검 (CronJob)</text>
  <text class="s" x="112" y="158" text-anchor="middle">화면 "지금 점검" 버튼</text>
  <text class="s" x="112" y="174" text-anchor="middle">CLI: kg check / investigate</text>

  <rect class="code" x="225" y="96" width="200" height="88" rx="6"/>
  <text class="t" x="325" y="122" text-anchor="middle" font-weight="700">수집과 점검</text>
  <text class="s" x="325" y="142" text-anchor="middle">Kubernetes 상태 수집</text>
  <text class="s" x="325" y="158" text-anchor="middle">규칙 14종 (장애 신호 12종)</text>
  <text class="s" x="325" y="174" text-anchor="middle">API 시나리오 실제 호출</text>

  <polygon points="545,92 630,140 545,188 460,140" fill="#fefce8" stroke="#a16207" stroke-width="1.6"/>
  <text class="t" x="545" y="137" text-anchor="middle" font-weight="700">문제 상황인가?</text>
  <text class="s" x="545" y="154" text-anchor="middle">(경로 A 또는 B)</text>

  <rect class="code" x="680" y="96" width="260" height="70" rx="6"/>
  <text class="t" x="810" y="122" text-anchor="middle" font-weight="700">AI 호출 없음</text>
  <text class="s" x="810" y="142" text-anchor="middle">정상(경로 C)이면 점검 이력만 기록</text>
  <text class="s" x="810" y="158" text-anchor="middle">같은 문제가 이어지면 리마인더만</text>

  <rect class="note" x="680" y="174" width="270" height="110" rx="6"/>
  <text class="t" x="692" y="192" font-weight="700" font-size="12.5">AI 조사로 가는 조건 (모두 맞아야)</text>
  <text class="s" x="692" y="209">- 규칙은 통과, 실제 호출이 실패함 (경로 B)</text>
  <text class="s" x="692" y="225">  또는 운영자가 증상을 직접 입력함</text>
  <text class="s" x="692" y="241">- 새 이슈 또는 지문 변경 (같은 문제는 제외)</text>
  <text class="s" x="692" y="257">- 경로 A(규칙 적발)는 AI 없이</text>
  <text class="s" x="692" y="273">  규칙 결과만 표시하고 알림</text>

  <rect class="out" x="455" y="222" width="180" height="56" rx="6"/>
  <text class="t" x="545" y="245" text-anchor="middle" font-weight="700">1차 감지 알림 (Slack)</text>
  <text class="s" x="545" y="264" text-anchor="middle">조사를 기다리지 않고 먼저 보냄</text>

  <line class="edge" x1="195" y1="140" x2="223" y2="140" marker-end="url(#arr)"/>
  <line class="edge" x1="425" y1="140" x2="458" y2="140" marker-end="url(#arr)"/>
  <line class="edge" x1="630" y1="131" x2="678" y2="131" marker-end="url(#arr)"/>
  <text class="elabel" x="636" y="124">아니오</text>
  <line class="edge" x1="545" y1="188" x2="545" y2="220" marker-end="url(#arr)"/>
  <text class="elabel" x="552" y="208">예</text>

  <!-- 1차 알림 → load_context -->
  <path class="edge" d="M545,278 L545,310 L130,310 L130,368" marker-end="url(#arr)"/>
  <text class="elabel" x="140" y="305">경로 B만: 조사 대기열에 넣고 작업자가 집음</text>

  <!-- ===== 2. AI 조사 ===== -->
  <rect class="lane" x="10" y="318" width="950" height="500" rx="8"/>
  <text class="laneTitle" x="26" y="342">2. AI 조사 (LangGraph 그래프, 노드마다 조사 로그를 DB에 기록)</text>

  <!-- 남은 문제 → plan (위쪽 경로) -->
  <path class="edge" d="M30,705 L18,705 L18,352 L700,352 L700,360 L790,360 L790,368" marker-end="url(#arr)" stroke-dasharray="6 3"/>

  <!-- row a -->
  <rect class="code" x="30" y="370" width="200" height="66" rx="6"/>
  <text class="node" x="130" y="396" text-anchor="middle">load_context</text>
  <text class="s" x="130" y="416" text-anchor="middle">환경·지침 지식, 상태 초기화</text>

  <rect class="code" x="260" y="370" width="200" height="66" rx="6"/>
  <text class="node" x="360" y="396" text-anchor="middle">preliminary</text>
  <text class="s" x="360" y="416" text-anchor="middle">가설 없이 확정할 사실 확인</text>

  <rect class="llm" x="490" y="370" width="200" height="66" rx="6"/>
  <text class="node" x="590" y="396" text-anchor="middle">triage</text>
  <text class="s" x="590" y="416" text-anchor="middle">중요한 문제 선별 (최대 3건)</text>

  <rect class="llm" x="720" y="370" width="200" height="66" rx="6"/>
  <text class="node" x="820" y="396" text-anchor="middle">plan</text>
  <text class="s" x="820" y="416" text-anchor="middle">가설 (최대 3개)과 조사 계획</text>

  <line class="edge" x1="230" y1="403" x2="258" y2="403" marker-end="url(#arr)"/>
  <line class="edge" x1="460" y1="403" x2="488" y2="403" marker-end="url(#arr)"/>
  <line class="edge" x1="690" y1="403" x2="718" y2="403" marker-end="url(#arr)"/>
  <text class="elabel" x="430" y="366">남은 문제가 있으면 다음 문제의 plan으로 (점선)</text>

  <!-- row b: 도구 반복 루프 -->
  <rect class="llm" x="720" y="510" width="200" height="66" rx="6"/>
  <text class="node" x="820" y="536" text-anchor="middle">act</text>
  <text class="s" x="820" y="556" text-anchor="middle">다음에 부를 도구 선택</text>

  <rect class="code" x="490" y="510" width="200" height="66" rx="6"/>
  <text class="node" x="590" y="536" text-anchor="middle">tools</text>
  <text class="s" x="590" y="556" text-anchor="middle">실행, 마스킹, 근거 저장</text>

  <rect class="code" x="230" y="510" width="230" height="66" rx="6"/>
  <text class="node" x="240" y="529" style="font-size:11px">limit</text>
  <text class="s" x="322" y="529" style="font-size:10.5px">전체 상한·시간 도달</text>
  <text class="node" x="240" y="546" style="font-size:11px">skip_calls</text>
  <text class="s" x="322" y="546" style="font-size:10.5px">문제당 상한만 도달</text>
  <text class="node" x="240" y="563" style="font-size:11px">limit_time</text>
  <text class="s" x="322" y="563" style="font-size:10.5px">도구 실행 뒤 시간 초과</text>

  <line class="edge" x1="820" y1="436" x2="820" y2="508" marker-end="url(#arr)"/>
  <line class="loop" x1="720" y1="528" x2="693" y2="528" marker-end="url(#arrLoop)"/>
  <line class="loop" x1="693" y1="558" x2="720" y2="558" marker-end="url(#arrLoop)"/>
  <line class="edge" x1="490" y1="543" x2="463" y2="543" marker-end="url(#arr)"/>
  <text class="loopLabel" x="470" y="482">반복: 도구 요청이 있는 동안 act ⇄ tools</text>
  <text class="elabel" x="470" y="502" fill="#c2410c">상한: 문제당 8회, 전체 20회, 150초</text>

  <!-- act가 도구를 더 부르지 않거나 상한에 걸리면: 위쪽 경로 -->
  <path class="edge" d="M750,510 L750,455 L105,455 L105,670" marker-end="url(#arr)"/>
  <path class="edge" d="M345,455 L345,508" marker-end="url(#arr)"/>
  <path class="edge" d="M200,455 L200,705 L218,705" marker-end="url(#arr)"/>
  <text class="elabel" x="355" y="476">상한 도달</text>

  <!-- 외부 도구 -->
  <rect class="ext" x="490" y="600" width="215" height="50" rx="6"/>
  <text class="t" x="597" y="619" text-anchor="middle" font-weight="700" font-size="12.5">도구 7종 (조회 전용)</text>
  <text class="s" x="597" y="638" text-anchor="middle">Kubernetes API, 서비스 HTTP 호출</text>
  <line class="edge" x1="590" y1="576" x2="590" y2="598" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- row c -->
  <rect class="code" x="30" y="672" width="150" height="66" rx="6"/>
  <text class="node" x="105" y="698" text-anchor="middle">next_issue</text>
  <text class="s" x="105" y="718" text-anchor="middle">다음 문제로 넘어감</text>

  <rect class="llm" x="220" y="672" width="170" height="66" rx="6"/>
  <text class="node" x="305" y="698" text-anchor="middle">write_report</text>
  <text class="s" x="305" y="718" text-anchor="middle">보고서 작성 (정해진 형식)</text>

  <rect class="code" x="410" y="672" width="170" height="66" rx="6"/>
  <text class="node" x="495" y="698" text-anchor="middle">validate</text>
  <text class="s" x="495" y="718" text-anchor="middle" style="font-size:11px">근거 번호 확인, 없으면 추정</text>

  <rect class="code" x="600" y="672" width="170" height="66" rx="6"/>
  <text class="node" x="685" y="698" text-anchor="middle">stop_check</text>
  <text class="s" x="685" y="718" text-anchor="middle">못 본 영역 검사, 재조사 판단</text>

  <rect class="code" x="790" y="672" width="150" height="66" rx="6"/>
  <text class="t" x="865" y="698" text-anchor="middle" font-weight="700">조사 종료</text>
  <text class="s" x="865" y="718" text-anchor="middle">완료 또는 조사 미완</text>

  <path class="edge" d="M280,576 L280,620 L105,620"/>
  <text class="elabel" x="112" y="612">다음 문제 있음</text>
  <path class="edge" d="M330,576 L330,670" marker-end="url(#arr)"/>
  <text class="elabel" x="208" y="652">다음 문제 없음</text>
  <line class="edge" x1="390" y1="705" x2="408" y2="705" marker-end="url(#arr)"/>
  <line class="edge" x1="580" y1="705" x2="598" y2="705" marker-end="url(#arr)"/>
  <line class="edge" x1="770" y1="705" x2="788" y2="705" marker-end="url(#arr)"/>
  <path class="edge" d="M495,738 L495,762 L305,762 L305,741" marker-end="url(#arr)"/>
  <text class="elabel" x="318" y="778">결론에 근거가 없으면 1회만 다시 작성</text>
  <path class="edge" d="M745,672 L745,616 L800,616 L800,578" marker-end="url(#arr)"/>
  <text class="elabel" x="752" y="634">빈틈이 있으면 1회만 재조사</text>
  <text class="elabel" x="752" y="649">(시간 +60초)</text>

  <rect class="fail" x="720" y="752" width="220" height="62" rx="6"/>
  <text class="t" x="830" y="772" text-anchor="middle" font-weight="700" fill="#b91c1c">failed (LLM 오류)</text>
  <text class="s" x="830" y="790" text-anchor="middle">어느 LLM 노드에서든 바로 종료</text>
  <text class="s" x="830" y="805" text-anchor="middle" style="font-size:10.5px">(재조사 중 오류는 1차 보고서 유지)</text>

  <!-- ===== 3. 출력과 기록 ===== -->
  <rect class="lane" x="10" y="838" width="950" height="130" rx="8"/>
  <text class="laneTitle" x="26" y="862">3. 출력과 기록 (코드만 실행)</text>

  <rect class="out" x="720" y="878" width="220" height="74" rx="6"/>
  <text class="t" x="830" y="898" text-anchor="middle" font-weight="700">보고서 저장</text>
  <text class="s" x="830" y="916" text-anchor="middle">조사 기록(DB)과 보고서 화면</text>
  <text class="s" x="830" y="932" text-anchor="middle">판단 수준(확정·후보·추정) 부여</text>
  <text class="s" x="830" y="946" text-anchor="middle" style="font-size:10.5px">근거 원문은 화면에서 확인</text>

  <rect class="out" x="490" y="878" width="200" height="74" rx="6"/>
  <text class="t" x="590" y="902" text-anchor="middle" font-weight="700">알림 갱신 (Slack)</text>
  <text class="s" x="590" y="921" text-anchor="middle">1차 알림을 원인, 조치,</text>
  <text class="s" x="590" y="938" text-anchor="middle">보고서 링크로 바꾸고 답글</text>

  <rect class="out" x="260" y="878" width="200" height="74" rx="6"/>
  <text class="t" x="360" y="902" text-anchor="middle" font-weight="700">이슈에 결과 기록</text>
  <text class="s" x="360" y="921" text-anchor="middle">조사 상태와 최종 심각도를</text>
  <text class="s" x="360" y="938" text-anchor="middle">남기고 조사 대기 완료</text>

  <rect class="ext" x="30" y="878" width="200" height="74" rx="6"/>
  <text class="t" x="130" y="898" text-anchor="middle" font-weight="700">이력 질문 (채팅, kg ask)</text>
  <text class="s" x="130" y="916" text-anchor="middle">별도 에이전트가 저장된 점검·</text>
  <text class="s" x="130" y="932" text-anchor="middle">이슈·알림·보고서와 지식 문서를</text>
  <text class="s" x="130" y="946" text-anchor="middle" style="font-size:10.5px">도구로 조회해 답함</text>

  <path class="edge" d="M940,705 L950,705 L950,915 L942,915" marker-end="url(#arr)"/>
  <path class="redEdge" d="M720,795 L705,795 L705,858 L650,858 L650,876" marker-end="url(#arrRed)"/>
  <text class="elabel" x="470" y="832" fill="#b91c1c">실패: "원인을 확정하지 못함"으로 갱신</text>
  <line class="edge" x1="720" y1="915" x2="692" y2="915" marker-end="url(#arr)"/>
  <line class="edge" x1="490" y1="915" x2="462" y2="915" marker-end="url(#arr)"/>
  <line class="edge" x1="260" y1="915" x2="232" y2="915" marker-end="url(#arr)"/>

  <!-- ===== State 패널 ===== -->
  <rect class="stPanel" x="978" y="50" width="410" height="918" rx="8"/>
  <text class="laneTitle" x="994" y="74">조사 상태 (InvestigationState)</text>
  <text class="d" x="994" y="92">들여쓰기 = 필드 안의 필드(depth). 오른쪽 = 값을 쓰는 노드</text>
  <g>
    <text class="stHead" x="994" y="118">입력: 조사 요청 (조사 중 바뀌지 않음)</text>
    <text class="f" x="1000" y="137">request</text>
    <text class="w" x="1378" y="137">입력</text>
    <text class="f" x="1018" y="154">trigger, gate_path, user_symptom</text>
    <text class="f" x="1018" y="171">signal_board (서비스별 신호), topology</text>
    <text class="f" x="1018" y="188">symptoms[] (실패한 API 시나리오)</text>
    <text class="stHead" x="994" y="217">사전 확인</text>
    <text class="f" x="1000" y="236">facts[]</text>
    <text class="w" x="1378" y="236">preliminary</text>
    <text class="f" x="1018" y="253">statement, evidence_ids[]</text>
    <text class="stHead" x="994" y="282">선별과 계획</text>
    <text class="f" x="1000" y="301">triage</text>
    <text class="w" x="1378" y="301">triage</text>
    <text class="f" x="1018" y="318">issues[] (최대 3)</text>
    <text class="f" x="1036" y="335">rank, title, impact, confidence,</text>
    <text class="f" x="1036" y="352">evidence_ids[], cause_resource</text>
    <text class="f" x="1018" y="369">runbook (조사 지침 이름)</text>
    <text class="f" x="1000" y="386">current_issue</text>
    <text class="w" x="1378" y="386">load_context, next_issue</text>
    <text class="f" x="1000" y="403">plans[] (문제별 가설 계획)</text>
    <text class="w" x="1378" y="403">load_context, plan</text>
    <text class="f" x="1018" y="420">hypotheses[] (최대 3)</text>
    <text class="f" x="1036" y="437">statement, area, check</text>
    <text class="f" x="1018" y="454">order[] (영역을 볼 순서)</text>
    <text class="stHead" x="994" y="483">도구 반복 (act, tools)</text>
    <text class="f" x="1000" y="502">messages[]</text>
    <text class="w" x="1378" y="502">plan, act, tools</text>
    <text class="d" x="1018" y="519">LLM ↔ 도구 대화 (상한·재조사 안내 포함)</text>
    <text class="f" x="1000" y="536">observations[]</text>
    <text class="w" x="1378" y="536">preliminary, tools</text>
    <text class="f" x="1018" y="553">evidence_id, tool, kind, name, via, ok</text>
    <text class="f" x="1000" y="570">seen[]</text>
    <text class="w" x="1378" y="570">load_context, tools</text>
    <text class="d" x="1018" y="587">받은 근거 번호. 근거 원문은 DB, State에는 번호만</text>
    <text class="f" x="1000" y="604">limited</text>
    <text class="w" x="1378" y="604">limit, limit_time, tools</text>
    <text class="d" x="1018" y="621">전체 상한·시간 도달 (호출 수·시간은 BudgetTracker가 셈)</text>
    <text class="stHead" x="994" y="650">보고서와 종료</text>
    <text class="f" x="1000" y="669">report</text>
    <text class="w" x="1378" y="669">write_report, validate</text>
    <text class="f" x="1018" y="686">conclusion, confidence, impact_scope</text>
    <text class="f" x="1018" y="703">issues[], preliminary_facts[], cause_chain[]</text>
    <text class="f" x="1018" y="720">hypotheses[] (status: 지지 / 배제 / 보류)</text>
    <text class="f" x="1018" y="737">coverage (run, config, wiring, logs)</text>
    <text class="f" x="1018" y="754">actions[], verification, evidence_ids[]</text>
    <text class="f" x="1000" y="771">report_attempts</text>
    <text class="w" x="1378" y="771">load_context, write_report</text>
    <text class="f" x="1000" y="788">rechecked, recheck</text>
    <text class="w" x="1378" y="788">load_context, stop_check</text>
    <text class="f" x="1000" y="805">first_report, first_status</text>
    <text class="w" x="1378" y="805">stop_check</text>
    <text class="f" x="1000" y="822">status</text>
    <text class="w" x="1378" y="822">load_context, validate</text>
    <text class="d" x="1018" y="839">running / done / incomplete (오류는 BaseAgent.run이 failed)</text>
    <line x1="994" y1="862" x2="1374" y2="862" stroke="#c4b5fd"/>
    <text class="d" x="994" y="882">분기는 LLM이 아니라 코드가 정한다. State 값(issues 수,</text>
    <text class="d" x="994" y="899">limited, rechecked, report.evidence_ids)과 예산(도구 호출</text>
    <text class="d" x="994" y="916">수·시간)을 본다. State는 메모리에만 두고 체크포인트는 쓰지</text>
    <text class="d" x="994" y="933">않는다. 노드마다 조사 로그(agent_step)를 DB에 남겨 보고서</text>
    <text class="d" x="994" y="950">화면과 디버깅에 쓴다.</text>
  </g>

  <text x="20" y="1000" font-size="11.5" fill="#64748b">실선 화살표 = 다음 단계, 점선 = 다음 문제로 되돌아감, 파란 점선 상자 = 에이전트 밖 외부 호출 또는 공통 지식 기반</text>
</svg>
