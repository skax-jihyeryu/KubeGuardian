<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1560" width="1920" height="1560" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1920" height="1560" fill="#ffffff"/>
<text x="960" y="60" font-size="44" font-weight="700" fill="#1A365D" text-anchor="middle">녹화 레이아웃 프리셋 3개 (데스크톱 1~3) (캔버스 1920 x 1080, 16:9)</text>
<text x="1000" y="105" font-size="28" fill="#4A5568" text-anchor="middle">화면 전체를 FocuSee로 한 번에 녹화하고, 장면마다 창 배치 단축키로 프리셋을 바꾼다.</text>
<g transform="translate(40,140)">
<rect width="880" height="495" fill="#F7FAFC" stroke="#1A365D" stroke-width="4"/>
<rect x="0" y="0" width="880" height="495" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="3"/><text x="440.0" y="217.5" font-size="40" font-weight="700" fill="#1A365D" text-anchor="middle">① 브라우저 (전체 화면)</text><text x="440.0" y="267.5" font-size="28" fill="#2C5282" text-anchor="middle">1920 x 1080</text>
</g>
<text x="40" y="680" font-size="38" font-weight="700" fill="#1A365D">L1 · 데스크톱 1 · 화면 전체</text>
<text x="40" y="722" font-size="28" fill="#2C5282">브라우저 1920 x 1080</text>
<text x="40" y="762" font-size="28" fill="#2D3748">로그가 필요 없는 장면. 둘러보기, 정상 확인 점검, 보고서, 이력 채팅</text>
<text x="40" y="802" font-size="30" font-weight="700" fill="#C05621">쓰는 장면: R1 · R6(정상 확인) · R11 · R11-7</text>
<g transform="translate(1000,140)">
<rect width="880" height="495" fill="#F7FAFC" stroke="#1A365D" stroke-width="4"/>
<rect x="0" y="0" width="587" height="495" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="3"/><text x="293.5" y="217.5" font-size="40" font-weight="700" fill="#1A365D" text-anchor="middle">① Slack</text><text x="293.5" y="267.5" font-size="28" fill="#2C5282" text-anchor="middle">1280 x 1080</text>
<rect x="587" y="0" width="293" height="247.5" fill="#2D3748" stroke="#2B6CB0" stroke-width="3"/><text x="733.5" y="115" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">③ 명령 터미널</text><text x="733.5" y="155" font-size="22" fill="#BEE3F8" text-anchor="middle">640 x 540</text>
<rect x="587" y="247.5" width="293" height="247.5" fill="#1A202C" stroke="#2B6CB0" stroke-width="3"/><text x="733.5" y="362" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">⑤ Pod 감시</text><text x="733.5" y="402" font-size="22" fill="#BEE3F8" text-anchor="middle">640 x 540</text>
</g>
<text x="1000" y="680" font-size="38" font-weight="700" fill="#1A365D">L2 · 데스크톱 2 · 운영 화면</text>
<text x="1000" y="722" font-size="28" fill="#2C5282">왼쪽 2/3 Slack + 오른쪽 1/3 ③ 위 · ⑤ 아래 (각 640 x 540)</text>
<text x="1000" y="762" font-size="28" fill="#2D3748">읽는 순서: 명령(③) → Pod 변화(⑤) → Slack 알림 · 복구 알림</text>
<text x="1000" y="802" font-size="30" font-weight="700" fill="#C05621">쓰는 장면: R2 · R5-1 · R6 · R7 · R8(Slack) · R10</text>
<g transform="translate(40,860)">
<rect width="880" height="495" fill="#F7FAFC" stroke="#1A365D" stroke-width="4"/>
<rect x="0" y="0" width="587" height="495" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="3"/><text x="293.5" y="217.5" font-size="40" font-weight="700" fill="#1A365D" text-anchor="middle">① 브라우저 (창 B)</text><text x="293.5" y="267.5" font-size="28" fill="#2C5282" text-anchor="middle">1280 x 1080 · 점검 · 조사 중</text>
<rect x="587" y="0" width="293" height="371.25" fill="#1A202C" stroke="#2B6CB0" stroke-width="3"/><text x="733.5" y="170" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">② 작업자 로그</text><text x="733.5" y="210" font-size="22" fill="#BEE3F8" text-anchor="middle">640 x 810</text><text x="733.5" y="240" font-size="22" fill="#BEE3F8" text-anchor="middle">글자 20pt 이상</text>
<rect x="587" y="371.25" width="293" height="123.75" fill="#2D3748" stroke="#2B6CB0" stroke-width="3"/><text x="733.5" y="425" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">④ 서비스 로그</text><text x="733.5" y="456" font-size="20" fill="#BEE3F8" text-anchor="middle">640 x 270</text>
</g>
<text x="40" y="1400" font-size="38" font-weight="700" fill="#1A365D">L3 · 데스크톱 3 · 로그 화면</text>
<text x="40" y="1442" font-size="28" fill="#2C5282">왼쪽 2/3 창 B 1280 x 1080 + 오른쪽 1/3 ② 위 3/4 · ④ 아래 1/4</text>
<text x="40" y="1482" font-size="28" fill="#2D3748">창 B의 지금 점검 · 점검 상세와 로그(②·④)를 함께 볼 때</text>
<text x="40" y="1522" font-size="30" font-weight="700" fill="#C05621">쓰는 장면: R3 · R4 · R5-2 · R8 · R9(R9-2 포함)</text>
<g transform="translate(1000,860)">
<rect width="880" height="495" fill="#FFFFFF" stroke="#1A365D" stroke-width="3" stroke-dasharray="10 6"/>
<text x="440" y="48" font-size="32" font-weight="700" fill="#1A365D" text-anchor="middle">넘김은 이웃 한 칸만 · L1 ⇄ L2 ⇄ L3</text>
<text x="440" y="84" font-size="22" fill="#4A5568" text-anchor="middle">키: ⌃→ / ⌃←  (숫자 키는 ⌃1 ~ ⌃3) · 1↔3 직행 없음</text>
<text x="30" y="122" font-size="22" fill="#2D3748">L1 둘러보기 → ⌃→ L2 서비스 주소명 오류 주입</text>
<text x="30" y="150" font-size="22" fill="#2D3748">→ ⌃→ L3 창 B 지금 점검 · S04 · 결과 · 근거 서랍</text>
<text x="30" y="178" font-size="22" fill="#2D3748">→ L3 작업자 로그 · gateway 로그(규칙 경로)</text>
<text x="30" y="206" font-size="22" fill="#2D3748">→ 배너 ⌃← L2 Slack 1차 알림 · 원복</text>
<text x="30" y="234" font-size="22" fill="#2D3748">→ ⌃← L1 지금 점검 · 정상 확인</text>
<text x="30" y="262" font-size="22" fill="#2D3748">→ ⌃→ L2 Slack 복구 알림 (녹화 밖 준비)</text>
<text x="30" y="290" font-size="22" fill="#2D3748">→ LLM 배포명 변경 주입 · Pod 정상 · 채팅 실패</text>
<text x="30" y="318" font-size="22" fill="#2D3748">→ ⌃→ L3 창 B 지금 점검 · 기능 점검 실패 · 조사 중</text>
<text x="30" y="346" font-size="22" fill="#2D3748">→ 배너 ⌃← L2 Slack '조사 중' 안내</text>
<text x="30" y="374" font-size="22" fill="#2D3748">→ ⌃→ L3 서비스 로그 403 줄 · AI 조사 로그 · 결과</text>
<text x="30" y="402" font-size="22" fill="#2D3748">→ 배너 ⌃← L2 Slack 갱신 · 스레드 답글</text>
<text x="30" y="430" font-size="22" fill="#2D3748">→ 보고서 링크 → L1 보고서(결론 · 가설 · 근거)</text>
<text x="30" y="458" font-size="22" fill="#2D3748">→ L1 이력 채팅 (끝) · 원복은 녹화 밖</text>
</g>
</svg>
