<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1500" width="1920" height="1500" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="1920" height="1500" fill="#ffffff"/>
  <!-- 캔버스 1920x1080 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F7FAFC" stroke="#1A365D" stroke-width="4"/>
  <!-- ① 브라우저 -->
  <rect x="0" y="0" width="1280" height="900" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="4"/>
  <text x="640" y="110" font-size="64" font-weight="700" fill="#1A365D" text-anchor="middle">① 브라우저</text>
  <text x="640" y="190" font-size="40" fill="#2C5282" text-anchor="middle">1280 x 900 (캡처와 같은 크기)</text>
  <text x="640" y="270" font-size="36" fill="#2D3748" text-anchor="middle">보고서 화면 (localhost:8080) / Slack 탭</text>
  <text x="640" y="330" font-size="36" fill="#2D3748" text-anchor="middle">1. 점검 상세 2. 이슈 상세 3. 근거 서랍</text>
  <rect x="320" y="400" width="640" height="300" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="640" y="560" font-size="32" fill="#718096" text-anchor="middle">화면 캡처 1280 x 900 이 들어간다</text>
  <!-- ① 아래 자막 띠 -->
  <rect x="0" y="900" width="1280" height="180" fill="#EDF2F7" stroke="#2B6CB0" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="640" y="975" font-size="40" font-weight="700" fill="#1A365D" text-anchor="middle">자막 띠 1280 x 180</text>
  <text x="640" y="1030" font-size="32" fill="#4A5568" text-anchor="middle">녹화 때는 비워 둔다. 편집에서 자막·구간 이름을 올린다.</text>
  <!-- ② 작업자 로그 -->
  <rect x="1280" y="0" width="640" height="648" fill="#1A202C" stroke="#2B6CB0" stroke-width="4"/>
  <text x="1600" y="90" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle">② 작업자 로그</text>
  <text x="1600" y="150" font-size="32" fill="#BEE3F8" text-anchor="middle">640 x 648 (오른쪽 위 60%)</text>
  <text x="1600" y="230" font-size="30" fill="#E2E8F0" text-anchor="middle">[조사] [작업] [알림] 줄만 보인다</text>
  <text x="1600" y="285" font-size="30" fill="#E2E8F0" text-anchor="middle">글자 16pt 이상, 한 줄 70자 안팎</text>
  <text x="1600" y="340" font-size="30" fill="#E2E8F0" text-anchor="middle">C8 조사 구간은 편집에서 ②를</text>
  <text x="1600" y="385" font-size="30" fill="#F6AD55" font-weight="700" text-anchor="middle">전체 화면으로 확대한다</text>
  <!-- ③ 명령 터미널 -->
  <rect x="1280" y="648" width="640" height="432" fill="#2D3748" stroke="#2B6CB0" stroke-width="4"/>
  <text x="1600" y="730" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle">③ 명령 터미널</text>
  <text x="1600" y="790" font-size="32" fill="#BEE3F8" text-anchor="middle">640 x 432 (오른쪽 아래 40%)</text>
  <text x="1600" y="870" font-size="30" fill="#E2E8F0" text-anchor="middle">주입 · 점검 실행 · 점검 Job 로그</text>
  <text x="1600" y="925" font-size="30" fill="#E2E8F0" text-anchor="middle">장면마다 명령만 바꾼다</text>
  <text x="1600" y="980" font-size="30" fill="#E2E8F0" text-anchor="middle">(위아래로 나누지 않는다)</text>
  <!-- 치수선 -->
  <text x="1560" y="1330" font-size="36" fill="#1A365D" font-weight="700" text-anchor="middle">녹화 캔버스 1920 x 1080 (16:9)</text>
  <line x1="0" y1="1100" x2="1920" y2="1100" stroke="#1A365D" stroke-width="3"/>
  <line x1="0" y1="1085" x2="0" y2="1115" stroke="#1A365D" stroke-width="3"/>
  <line x1="1280" y1="1085" x2="1280" y2="1115" stroke="#1A365D" stroke-width="3"/>
  <line x1="1920" y1="1085" x2="1920" y2="1115" stroke="#1A365D" stroke-width="3"/>
  <text x="640" y="1170" font-size="34" fill="#2C5282" text-anchor="middle">왼쪽 1280 px (66.7%)</text>
  <text x="1600" y="1170" font-size="34" fill="#2C5282" text-anchor="middle">오른쪽 640 px (33.3%)</text>
  <text x="1600" y="1215" font-size="30" fill="#4A5568" text-anchor="middle">위 648 px (60%) / 아래 432 px (40%)</text>
  <!-- 편집 메모: C8 확대 -->
  <rect x="40" y="1230" width="1160" height="230" rx="14" fill="#FFFAF0" stroke="#DD6B20" stroke-width="3"/>
  <text x="70" y="1285" font-size="38" font-weight="700" fill="#C05621">편집 메모: C8 조사 로그 장면 (장면 R9)</text>
  <text x="70" y="1345" font-size="32" fill="#2D3748">원본 캔버스에서 ② 영역(640 x 648)을 잘라 1920 x 1080 으로 확대한다.</text>
  <text x="70" y="1395" font-size="32" fill="#2D3748">확대 배율은 약 1.67배(높이 기준 1080 / 648)이고 좌우는 검은 여백으로 채운다.</text>
  <text x="70" y="1445" font-size="32" fill="#2D3748">그러려면 원본에서 ② 글자가 16pt 이상이어야 확대 후에도 줄 끝 말줄임(…)까지 읽힌다.</text>
</svg>
