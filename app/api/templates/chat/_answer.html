<div class="a">{% for s in answer.sentences %}<p>{{ s.text }}{% if s.kind == 'interpretation' %} <em>(추정)</em>{% endif %}
{% for id in s.evidence_ids %}<details><summary class="ev" hx-get="/{{ p }}/chat/evidence/{{ id }}" hx-trigger="click once" hx-target="next .evx">근거 {{ id.split("-")[-1]|int }}</summary><div class="evx"></div></details>{% endfor %}
{% for id in s.issue_ids %}<a href="/{{ p }}/issues/{{ id }}">이슈 #{{ id }}</a> {% endfor %}
{% for id in s.run_ids %}<a href="/{{ p }}/checks/{{ id }}">점검 #{{ id }}</a> {% endfor %}</p>{% endfor %}</div>
