{% for kind, id, label, detail in records %}
<button type="button" class="chat-record-option" data-chat-pick="{{ kind }}" data-record-id="{{ id }}" id="chat-option-{{ kind }}-{{ id }}" role="option" aria-selected="false" tabindex="-1"><strong>{{ label }} #{{ id }}</strong><span class="s13 muted">{{ detail }}</span></button>
{% else %}<p class="s13 muted">일치하는 이슈나 점검이 없습니다.</p>{% endfor %}
