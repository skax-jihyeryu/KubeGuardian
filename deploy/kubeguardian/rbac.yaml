# KubeGuardian 진단 에이전트의 ServiceAccount와 최소 권한 (기획서 §13).
# 조회(get/list/watch)만 허용한다. 생성·수정·삭제 권한은 주지 않는다.
#
# secrets: 앱은 metadata-only 요청(PartialObjectMetadata)으로만 Secret의 존재·키 이름을 확인하고
# 값은 수집하지 않는다. 다만 RBAC는 리소스 단위라 이 ClusterRole로도 Secret 값을 읽을 수 있다.
# 이 잔여 위험은 기획서 §13에 문서화했다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeguardian
  namespace: kubeguardian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeguardian-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - configmaps
      - nodes
      - namespaces
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeguardian-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeguardian-readonly
subjects:
  - kind: ServiceAccount
    name: kubeguardian
    namespace: kubeguardian
