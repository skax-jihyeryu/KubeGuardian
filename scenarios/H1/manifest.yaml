# H1: 설정(ConfigMap·Secret)이 하나도 없어도 정상인 서비스. 이미지는 노드에 있는 것만 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h1-noconfig
  labels:
    app: h1-noconfig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h1-noconfig
  template:
    metadata:
      labels:
        app: h1-noconfig
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        - name: client
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: CACHE_URL        # 같은 Pod의 web 컨테이너 (사이드카 localhost)
              value: "http://localhost:80"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: h1-noconfig
spec:
  selector:
    app: h1-noconfig
  ports:
    - port: 80
      targetPort: 80
