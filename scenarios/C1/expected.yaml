# C1 정답 파일 (기획서 §8.2). 기능보다 먼저 쓴다.
# 주입은 HTTPChaos로 llm-gateway 채팅 응답을 429(insufficient_quota)로 바꾼다 (README "주입 방식")
id: C1
level: L3                 # 증상(채팅 실패)은 gateway·agent에, 원인은 llm-gateway 응답에 있다. K8s는 정상
k8s_visible: false        # Pod·Service·설정 모두 정상. agent 로그나 llm-gateway 직접 호출로만 원인이 보인다
gate_path: B              # 규칙 신호 없음. 증상 감지(API 시나리오 chat 실패)로 경로 B
must_signals: []   # 장애 신호 규칙으로 잡히는 것이 없다 (05-rules §5)
allowed_signals: []
forbidden_signals: []
must_check:
  wiring: "채팅 응답 answer의 429 오류 문구"
expected_cause:
  - {kind: Deployment, name: llm-gateway}
  - {kind: Service, name: llm-gateway}
key_evidence:
  - id: llm-gateway-429
    desc: "llm-gateway가 채팅 완성 요청에 429(Too Many Requests, insufficient_quota)를 돌려준 기록"
    # HTTPChaos가 llm-gateway의 응답을 바꾸므로 llm-gateway 자기 로그에는 429가 남지 않는다 (2026-10-26 C1 실행의 llm-gateway 로그로 확인).
    # 429는 호출한 agent 로그("POST http://llm-gateway-svc:8080/api/v1/chat/completions ... 429 Too Many Requests")로 관측된다
    obtainable: true
    any_of:
      - {kind: log_excerpt, subject: "*/Pod/agent-*", contains: ["chat/completions", "429 too many requests"]}
not_a_cause:
  - text: "agent는 정상이다 (llm-gateway가 돌려준 429를 그대로 전한 것)"
    resource: {kind: Deployment, name: agent}
root_cause: "llm-gateway가 LLM 호출(채팅 완성 요청)에 429(할당량 초과)를 돌려줘 채팅이 실패한다"
affected_services: [llm-gateway, agent, gateway, front-chat]
expected_top1: "llm-gateway가 채팅 요청에 429(할당량 초과)를 돌려줘 채팅이 실패"
