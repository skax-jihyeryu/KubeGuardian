# B1 정답 파일 (기획서 §8.2). 기능보다 먼저 쓴다.
id: B1
level: L2                 # "요청 일부만 실패"와 "Pod별 응답 차이"를 연결해야 원인 Pod가 드러난다
# 기획서 §8.2는 C1·C2·C5·E1만 k8s_visible: false로 둔다. B1의 원인 Pod는 K8s 객체로 특정할 수 있다.
# 다만 agent Pod는 3개 모두 Ready이고 재시작·이벤트가 없어, 원인 Pod를 찾으려면 Pod별 직접 호출(probe)이나 Pod별 로그가 필요하다
k8s_visible: true
gate_path: B              # 규칙 신호 없음. 사용자 입력(증상 신고)으로 경로 B (기획서 §8.2)
# 평가 러너가 kg investigate 증상과 같은 입력으로 넘긴다. 기획서 §8.2의 사용자 증상이다. 원인을 적지 않는다.
# chat API 시나리오는 요청 하나라 건강한 Pod에 닿으면 통과하므로, 이 입력이 없으면 경로가 실행마다 달라진다
user_symptom: "채팅 요청이 간헐적으로 실패합니다. 요청의 약 1/3이 오류로 끝납니다."
must_signals: []   # 장애 신호 규칙으로 잡히는 것이 없다
allowed_signals: []
forbidden_signals: []
must_check:
  run: "agent Pod 하나만 HTTP 500을 돌려주고 나머지는 정상"
expected_cause:
  - {kind: Pod, name: "${injected_target}"}   # inject.sh가 .state/target에 기록한 Pod. 소유 관계 규칙 없이 정확히 일치해야 한다
key_evidence:
  - id: target-pod-500
    desc: "주입 대상 agent Pod만 상태 확인 요청에 HTTP 500을 돌려준다"
    obtainable: true          # probe via=pod가 Pod별 호출 결과(calls[].pod·status)를 돌려준다 (2026-11-01 B1 주입 중 실제 출력으로 확인, README).
                              # Pod 로그는 응답 코드를 바꾸는 tproxy 바깥이라 500이 남지 않을 수 있어 넣지 않는다
    any_of:
      - {kind: probe_result, subject: "*/Service/agent", contains: ["${injected_target}", '"status": 500']}
      - {kind: probe_result, subject: "*/Pod/${injected_target}", contains: '"status": 500'}
root_cause: "agent Pod 3개 중 1개만 모든 요청에 HTTP 500을 돌려준다 (나머지 Pod는 정상)"
affected_services: [agent, gateway, front-chat]
expected_top1: "agent Pod 1개만 HTTP 500을 돌려줘 agent 요청 일부가 실패"
