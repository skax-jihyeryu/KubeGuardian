# C2 정답 파일 (기획서 §8.2). 기능보다 먼저 쓴다.
id: C2
level: L3                 # 증상(로그인 불가)은 front-chat·gateway에, 원인은 admin ↔ redis 네트워크에 있다. K8s는 정상
k8s_visible: false        # Pod는 모두 Ready, Service·설정도 정상. 앱 로그·연결 확인으로만 원인이 보인다
gate_path: B              # 규칙 신호 없음. 증상 감지(API 시나리오 로그인 실패)로 경로 B
must_signals: []   # 장애 신호 규칙으로 잡히는 것이 없다 (05-rules §5)
allowed_signals: []
forbidden_signals: []
must_check:
  wiring: "로그인 요청이 응답 대기 끝에 시간 초과(504)로 실패"
expected_cause:
  - {kind: Deployment, name: admin}
  - {kind: Deployment, name: redis}
key_evidence:
  - id: admin-redis-connect-fail
    desc: "admin 로그에 redis 연결 실패·시간 초과가 남는다"
    # obtainable: false. 2026-10-21~26 C2 실행 5회 중 kg.db가 남은 2회(20261026T024945Z, 20261026T060504Z)의
    # evidence(subject */Pod/admin-*, 100줄)에 redis·connect·timeout 줄이 없다. 연결이 걸려 멈춰 오류 줄이 안 남는다.
    # 도구가 이 사실을 돌려주지 못한다 → 도구 한계 시나리오 (F1)
    obtainable: false
    any_of:
      - {kind: log_excerpt, subject: "*/Pod/admin-*", contains: redis}
not_a_cause:
  - text: "gateway는 정상이다 (admin 응답을 기다리다 504를 낼 뿐)"
    resource: {kind: Deployment, name: gateway}
root_cause: "admin에서 redis로 가는 네트워크가 차단되어 admin이 로그인 세션을 Redis에 저장하지 못하고 멈춘다"
affected_services: [admin, gateway, front-chat, front-admin]
expected_top1: "admin → Redis 연결 차단으로 로그인이 시간 초과(5xx)로 실패, Pod는 전부 Ready"
