[project]
name = "kubeguardian"
version = "0.1.0"
description = "AI 기반 Kubernetes 서비스 진단 Agent"
requires-python = ">=3.12,<3.13"
# 에이전트 프레임워크 등 런타임 의존성은 기능을 붙일 때 추가한다.
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "kubernetes>=37.0.1",
    "langchain-core>=1.6.10",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pre-commit>=4",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# app/이 Python 루트다 (import에 app. 접두사를 쓰지 않는다)
src = ["app", "tests"]
extend-exclude = [".claude"]  # 에이전트 worktree·로컬 계획 문서

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"
