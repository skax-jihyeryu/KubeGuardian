# 진단용 Azure OpenAI 연결 확인 Pod (이슈 #8 스파이크). run.sh로 실행한다.
apiVersion: v1
kind: Pod
metadata:
  name: llm-spike
  namespace: kubeguardian
spec:
  restartPolicy: Never
  containers:
    - name: spike
      image: python:3.12-slim
      command: ["sh", "-c"]
      args:
        - |
          set -e
          pip install -q --disable-pip-version-check langchain-openai pydantic-settings
          # 공개 CA(certifi) + 사내 프록시 CA를 합친 번들. SSL_CERT_FILE은 기본 저장소를 대체하므로 둘 다 넣는다
          cat "$(python -c 'import certifi; print(certifi.where())')" /ca/sk-ca.pem > /tmp/ca-bundle.pem
          export SSL_CERT_FILE=/tmp/ca-bundle.pem
          mkdir -p /work/core && cp /code/core-init.py /work/core/__init__.py
          cp /code/config.py /code/llm.py /work/core/ && cp /code/llm_smoke.py /work/
          python /work/llm_smoke.py
      envFrom:
        - secretRef:
            name: kg-azure-openai
      volumeMounts:
        - { name: code, mountPath: /code }
        - { name: ca, mountPath: /ca }
  volumes:
    - name: code
      configMap:
        name: llm-spike-code
    - name: ca
      configMap:
        name: kg-ca-bundle
